<!DOCTYPE html>
<html>
<head>
  <title>GUN001 QR Code</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: monospace; background: #111; color: #fff; }
    canvas { margin: 20px; }
    pre { background: #222; padding: 12px 20px; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>GUN001</h2>
  <canvas id="qr"></canvas>
  <pre>{"gunId":"GUN001","transmitter":"TX001","receiver":"RX001"}</pre>
  <script>
    QRCode.toCanvas(document.getElementById('qr'),
      JSON.stringify({"gunId":"GUN001","transmitter":"TX001","receiver":"RX001"}),
      { width: 300, margin: 2 }
    );
  </script>
</body>
</html>
